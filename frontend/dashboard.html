<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Student Record Management System</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <!-- topbar: page heading + administrator -->
    <header class="topbar">
      <h1 class="page-title">Dashboard</h1>
      <div class="admin-info" id="adminInfo"></div>
    </header>

    <div class="message" id="dashboardMessage"></div>

    <!-- Figure 2: four statistic cards (values come from MongoDB) -->
    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon" data-icon="totalStudents"></div>
        <div class="stat-label">Total Students</div>
        <div class="stat-value" id="totalStudents">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" data-icon="averageMarks"></div>
        <div class="stat-label">Average Marks</div>
        <div class="stat-value" id="averageMarks">0%</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" data-icon="passPercentage"></div>
        <div class="stat-label">Pass Percentage</div>
        <div class="stat-value" id="passPercentage">0%</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" data-icon="departments"></div>
        <div class="stat-label">Departments</div>
        <div class="stat-value" id="departments">0</div>
      </div>
    </section>

    <!-- Student Performance table -->
    <section class="panel">
      <div class="panel-head">
        <h2 class="panel-title">Student Performance</h2>
        <input class="form-control panel-search" type="text" id="performanceSearch" placeholder="Search Student..." />
      </div>

      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th style="width:13%">Roll No</th>
              <th style="width:23%">Name</th>
              <th style="width:24%">Department</th>
              <th style="width:15%">Semester</th>
              <th style="width:11%">Marks</th>
              <th style="width:14%">Status</th>
            </tr>
          </thead>
          <tbody id="performanceBody">
            <tr class="empty-row"><td colspan="6">Loading student records...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/page-icons.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
