<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Student Record Management System</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-page">
  <!-- Figure 1: Login Page -->
  <div class="login-card">
    <h1 class="login-title">Student Record<br />Management System</h1>
    <p class="login-subtitle">Login to Continue</p>

    <div class="message" id="loginMessage"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input class="form-control" type="text" id="username" name="username"
               placeholder="Enter Username" autocomplete="username" />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" type="password" id="password" name="password"
               placeholder="Enter Password" autocomplete="current-password" />
      </div>

      <button class="btn btn-block login-btn" type="submit" id="loginBtn">Login</button>
    </form>
  </div>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
