<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings - Student Record Management System</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <header class="topbar">
      <h1 class="page-title">Settings</h1>
      <div class="admin-info" id="adminInfo"></div>
    </header>

    <!-- Figure 7: System Settings -->
    <section class="panel panel-narrow">
      <div class="panel-head">
        <h2 class="panel-title">System Settings</h2>
      </div>

      <div class="message" id="settingsMessage"></div>

      <form id="settingsForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="administratorName">Administrator Name</label>
          <input class="form-control" type="text" id="administratorName" />
        </div>

        <div class="form-group">
          <label class="form-label" for="settingsEmail">Email</label>
          <input class="form-control" type="email" id="settingsEmail" />
        </div>

        <div class="form-group">
          <label class="form-label" for="collegeName">College Name</label>
          <input class="form-control" type="text" id="collegeName" />
        </div>

        <div class="form-group">
          <label class="form-label" for="theme">Theme</label>
          <select class="form-control" id="theme">
            <option value="Light">Light</option>
            <option value="Dark">Dark</option>
          </select>
        </div>

        <button class="btn" type="submit" id="saveSettingsBtn" style="margin-top:26px">
          <span data-icon="save"></span>Save Changes
        </button>
      </form>
    </section>
  </main>

  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/page-icons.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
